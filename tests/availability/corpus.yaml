        stage: initial_validation
        channel: network
        target: original_url
        attempt: 1
        result: redirect
        status: 302
        location: https://jobs.example.test/roles/redirected
        signals: [redirect]
        note: The original link redirects to an employer-owned careers host.
        fixture: http/redirect.txt
      - sequence: 2
        at: T+00m
        stage: initial_validation
        channel: network
        target: redirected_url
        attempt: 1
        result: job_page
        status: 200
        signals: [live_page]
        note: The final page contains the role and an application control.
        fixture: http/live_job.html
    user_state: ordinary
    expected:
      availability: live
      board_treatment: normal
      primary_action: apply
      secondary_action: none
      ranking_effect: none
      investigation:
        outcome: not_run
        stages: []
      replacement:
        behavior: none
        candidate_url: null
        requires_confirmation: false
        stored_url: original
    layers: [policy, network, board]
    policy_rules: [ranking_unchanged]
    justification: A bounded redirect that finishes on a usable employer page is live; unfamiliar hosting alone should not add friction.

