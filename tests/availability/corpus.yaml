schema_version: 1
policy_version: availability-policy-v1
approval:
  status: approved
  approved_by: project maintainer
  approved_on: "2026-08-30"

coverage_requirements:
  source_authority:
    - first_party_ats
    - community_list
    - unknown
  evidence_signal:
    - live_page
    - redirect
    - unusual_title
    - replacement_url
    - multiple_source_observations
    - single_404
    - repeated_404
    - single_410
    - repeated_410
    - employer_closure_text
    - generic_error_text
    - single_ats_absence
    - repeated_ats_absence
    - community_presence
    - community_removal
    - timeout
    - dns_failure
    - connection_failure
    - http_403
    - anti_bot
    - javascript_required
    - login_required
    - http_429
    - http_5xx
    - maintenance
    - redirect_loop
    - conflicting_evidence
    - original_recovered
    - replacement_discovered
    - closure_confirmed
    - investigation_unresolved
  user_state:
    - ordinary
    - interested
    - applied
  check_stage:
    - initial_validation
    - scheduled_retry
    - user_investigation
  investigation_outcome:
    - original_recovered
    - replacement_found
    - closure_confirmed
    - unresolved
  availability:
    - live
    - uncertain
    - closed
  board_treatment:
    - normal
    - warned
    - guarded
    - archived
    - visible_closed
  layer:
    - policy
    - network
    - board
    - investigation
  known_pattern:
    - point72_cubist
    - voloridge
    - workday_maintenance

policy_rules:
  community_pre_display_check: Community destinations are checked before the posting is first displayed.
  single_hard_failure_guard: One 404 or 410 keeps the posting visible and guards the failing Apply action.
  repeated_hard_failure_close: Two consistent hard failures may confirm that a posting closed.
  employer_closure_immediate: Specific employer-hosted closure text confirms closure immediately.
  generic_error_not_closure: Generic error text does not prove that a posting closed.
  first_party_absence_threshold: One complete first-party absence is uncertain; two complete absences may confirm closure.
  conflict_stays_uncertain: Conflicting trustworthy evidence produces uncertain, not automatic closure.
  protected_closed_visible: Applied and interested postings remain visible after closure.
  automation_barrier_apply_primary: Checker-only 403, anti-bot, JavaScript, and login barriers keep Apply primary.
  user_outage_verify_primary: User-facing outages make Verify and find application primary and Open Original secondary.
  replacement_requires_confirmation: A replacement candidate cannot change the stored URL without user confirmation.
  ranking_unchanged: Availability outcomes never become ranking labels or ranking effects.

mutants:
  archive_every_uncertain: Archive every uncertain posting.
  trust_community_presence: Treat community-list presence as proof that the destination is live.
  never_close_anything: Never classify any posting as closed.
  close_after_one_ambiguous_failure: Close a posting after one ambiguous failure or outage.
  archive_protected_jobs: Archive applied or interested postings after closure.
  closure_negative_ranking: Turn closure into a negative ranking effect.
  guard_apply_after_automation_403: Guard Apply after an automated checker receives 403.
  apply_primary_during_outage: Leave Apply primary during a known user-facing outage.
  replace_without_confirmation: Replace the stored posting URL without user confirmation.
  conflict_definitively_closed: Treat conflicting trustworthy evidence as definitively closed.

maintenance_rules:
  - Add a corpus case for each newly discovered production availability failure before fixing that failure.
  - Obtain the project maintainer's approval before changing an expected user-visible outcome or locked product expectation.
  - Engineers may refactor fixtures and add cases that follow already-approved policy without a separate product decision.
  - Keep real-derived fixtures minimal and sanitized; retain only excerpts needed to reproduce the behavior.
  - Increment schema_version for incompatible manifest-shape changes and policy_version for approved expectation changes.

live_canaries:
  - id: stripe_greenhouse_board
    authority: first_party_ats
    method: GET
    url: https://boards-api.greenhouse.io/v1/boards/stripe/jobs?content=false
    mutates: false
  - id: ramp_ashby_board
    authority: first_party_ats
    method: GET
    url: https://api.ashbyhq.com/posting-api/job-board/ramp
    mutates: false
  - id: sndsh404_community_list
    authority: community_list
    method: GET
    url: https://raw.githubusercontent.com/sndsh404/summer-2027-internships/main/README.md
    mutates: false

cases:
  - id: ats_live_initial
    category: confirmed_live
    description: A first-party ATS job page loads normally during initial validation.
    provenance:
      kind: synthetic
      note: Minimal first-party success response with a visible job title and application control.
    source:
      authority: first_party_ats
      kind: greenhouse
      label: Example employer ATS
    evidence_timeline:
      - sequence: 1
        at: T+00m
        stage: initial_validation
        channel: network
        target: original_url
        attempt: 1
        result: job_page
        status: 200
        signals: [live_page]
        note: The employer page shows the role details and an enabled application control.
        fixture: http/live_job.html
    user_state: ordinary
    expected:
      availability: live
      board_treatment: normal
      primary_action: apply
      secondary_action: none
      ranking_effect: none
      investigation:
        outcome: not_run
        stages: []
      replacement:
        behavior: none
        candidate_url: null
        requires_confirmation: false
        stored_url: original
    layers: [policy, network, board]
    policy_rules: [ranking_unchanged]
    justification: Direct first-party application evidence is enough to keep the ordinary Apply experience without a warning or ranking change.

