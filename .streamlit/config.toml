# internsHELPer dashboard theme — sleek/modern dark, mirroring planTracker's dark palette.
# Layer 1 (this file) drives global colors / radii / borders / fonts via the official Streamlit
# theme API. Layer 2 (internshelper/assets/dashboard.css, injected by dashboard.py) adds the
# polish the theme API can't express (frosted header, card hover, segmented View control, etc.).
# All keys here are valid Streamlit theme options (asserted in tests/test_dashboard.py).

[theme]
base = "dark"
primaryColor = "#6b78ff"            # planTracker dark-mode indigo (light mode uses #3f4ccc)
backgroundColor = "#1b1b1d"
secondaryBackgroundColor = "#242426"
textColor = "#f2f2f4"
linkColor = "#6b78ff"
borderColor = "#34343a"
dataframeHeaderBackgroundColor = "#2b2b2e"
dataframeBorderColor = "#34343a"
showWidgetBorder = true
baseRadius = "0.625rem"             # 10px — planTracker's --r-md
buttonRadius = "0.625rem"
baseFontSize = 14
headingFont = "Geist"
metricValueFontWeight = 700

# Geist display font, bundled (copied from planTracker). Served at app/static/* because
# [server] enableStaticServing is on; Streamlit serves static/ relative to the entrypoint's
# dir, so the files live in internshelper/static/ (next to dashboard.py).
[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-500.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-600.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/geist-700.woff2"
weight = 700
style = "normal"

[server]
enableStaticServing = true
