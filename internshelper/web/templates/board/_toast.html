{# One generic undoable toast: text + an undo form posting `fields` to `undo_url`. #}
<div hx-swap-oob="beforeend:#toast-region">
  <div class="toast{% if toast.kind == 'error' %} toast--error{% endif %}"
       role="{{ 'alert' if toast.kind == 'error' else 'status' }}"
       x-data="{ t: setTimeout(() => $el.remove(), 8000) }"
       x-on:htmx:after-request="if ($event.detail.successful) { clearTimeout(t); $el.remove() }">
    <span class="toast-mark" aria-hidden="true">{{ '!' if toast.kind == 'error' else '✓' }}</span>
    <span class="toast-text">{{ toast.text }}</span>
    <form hx-post="{{ toast.undo_url }}" hx-target="#board-region" hx-swap="innerHTML">
      {% for name, value in toast.fields.items() %}
      {% if name in ("notes", "expected_notes") %}
      <textarea name="{{ name }}" hidden>{{ value }}</textarea>
      {% else %}
      <input type="hidden" name="{{ name }}" value="{{ value }}">
      {% endif %}
      {% endfor %}
      <button class="btn btn-ghost btn-sm" type="submit">{{ toast.undo_label | default("Undo") }}</button>
    </form>
  </div>
</div>
