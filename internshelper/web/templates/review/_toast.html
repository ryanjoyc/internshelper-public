<div hx-swap-oob="beforeend:#toast-region">
  <div class="toast" x-data="{ t: setTimeout(() => $el.remove(), 6000) }"
       x-on:htmx:after-request="clearTimeout(t); $el.remove()">
    <span class="toast-text">{{ 'Matched' if toast.verdict == 'match' else 'No match' }} — {{ toast.company }}: {{ toast.title }}</span>
    <form hx-post="/review/undo"
          {% if toast.mode == 'focus' %}hx-target="#focus-card" hx-swap="outerHTML"{% else %}hx-target="#review-region" hx-swap="innerHTML"{% endif %}>
      <input type="hidden" name="posting_id" value="{{ toast.posting_id }}">
      <input type="hidden" name="mode" value="{{ toast.mode }}">
      <button class="btn btn-ghost btn-sm" type="submit">Undo</button>
    </form>
  </div>
</div>
