{% if summary.state == 'missing' %}
<p class="page-sub">No saved payload — judging by title only.</p>
{% elif summary.state == 'unreadable' %}
<p class="page-sub">Payload file unreadable.</p>
{% else %}
{% if summary.description %}<div class="peek-desc">{{ summary.description }}</div>{% endif %}
{% if raw_json %}
<details class="focus-raw">
  <summary>Raw payload</summary>
  <pre>{{ raw_json }}</pre>
</details>
{% endif %}
{% endif %}
