<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- InternsHELPer app icon — source of truth for internshelper/assets/icon-1024.png.
       macOS tile grid: 824x824 tile centered at (100,100),
       ~100px transparent margin, rounded squircle rx=185.
       Palette: dashboard indigo (#6b78ff -> #3f4ccc) with a white 🎯 target motif. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b78ff"/>
      <stop offset="1" stop-color="#3f4ccc"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- target rings (white, echoing the dashboard's 🎯 page icon) -->
  <circle cx="512" cy="512" r="264" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="44"/>
  <circle cx="512" cy="512" r="156" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="44"/>
  <circle cx="512" cy="512" r="60" fill="#ffffff"/>

  <!-- subtle inner shadow at the tile base for depth -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#000000" stroke-opacity="0.10" stroke-width="6"/>
</svg>
