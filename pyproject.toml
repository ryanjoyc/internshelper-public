[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internshelper"
version = "0.1.0"
description = "Scrape internship/new-grad postings, archive them, and email new matches hourly."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Streamlit kept out of core deps so the engine installs cleanly even where
# Streamlit lags a new Python release. Install with `.[dashboard]` for the UI.
# Pinned to 1.58.* because the dashboard's Layer-2 CSS targets that release's DOM.
dashboard = ["streamlit==1.58.*"]
# The web UI: FastAPI + Jinja2 server-rendered pages. HTMX/Alpine/Sortable are vendored
# static files (no Node, no build step). Kept out of core so the cron collector stays lean.
web = ["fastapi>=0.115,<1", "uvicorn>=0.30", "jinja2>=3.1"]
# The Dock app wraps the dashboard in a native WKWebView window. Separate extra because
# pywebview pulls the heavy pyobjc framework wheels (~100MB) on macOS.
app = ["internshelper[dashboard]", "pywebview>=5.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["internshelper*"]

[tool.setuptools.package-data]
internshelper = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient warns about its own httpx dependency; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
