[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internshelper"
version = "0.1.0"
description = "Scrape internship/new-grad postings, archive them, and email new matches hourly."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The web UI: FastAPI + Jinja2 server-rendered pages. HTMX/Alpine/Sortable are vendored
# static files (no Node, no build step). Kept out of core so the cron collector stays lean.
web = ["fastapi>=0.115,<1", "uvicorn>=0.30", "jinja2>=3.1"]
# The Dock app wraps the web UI in a native WKWebView window. Separate extra because
# pywebview pulls the heavy pyobjc framework wheels (~100MB) on macOS.
app = ["internshelper[web]", "pywebview>=5.1"]
dev = ["pytest>=8.0"]
# Optional real-browser regression checks. Install the browser separately with
# `.venv/bin/python -m playwright install chromium` after installing this extra.
ui = ["internshelper[dev,web]", "pytest-playwright>=0.7"]

[tool.setuptools.packages.find]
include = ["internshelper*"]

[tool.setuptools.package-data]
internshelper = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = [
    "browser: optional Playwright checks that require the ui extra and Chromium",
]
filterwarnings = [
    # starlette's TestClient warns about its own httpx dependency; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
