[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internshelper"
version = "0.1.0"
description = "Local-first internship collector and review dashboard for the browser and macOS Dock."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The web UI: FastAPI + Jinja2 server-rendered pages. HTMX/Alpine/Sortable are vendored
# static files (no Node, no build step). Kept out of core so the collector install stays lean.
web = ["fastapi>=0.115,<1", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.20"]
# The Dock app wraps the web UI in a native WKWebView window. Separate extra because
# pywebview pulls the heavy pyobjc framework wheels (~100MB) on macOS.
app = ["internshelper[web]", "pywebview>=5.1"]
dev = ["pytest>=8.0"]
# Optional real-browser regression checks. Install the browser separately with
# `.venv/bin/python -m playwright install chromium` after installing this extra.
ui = ["internshelper[dev,web]", "pytest-playwright>=0.7"]

[tool.setuptools.packages.find]
include = ["internshelper*"]

[tool.setuptools.package-data]
internshelper = ["assets/*", "web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not availability_baseline and not availability_contract and not live_canary'"
markers = [
    "browser: optional Playwright checks that require the ui extra and Chromium",
    "availability_baseline: optional replay of the frozen pre-implementation availability baseline",
    "availability_contract: approved availability behavior exercised through the production adapter",
    "live_canary: optional read-only, informational probes of selected real sources",
]
filterwarnings = [
    # starlette's TestClient warns about its own httpx dependency; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
